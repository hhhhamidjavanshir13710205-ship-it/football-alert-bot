name: Football Alert Bot

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      # ================================
      # دریافت کدها از GitHub
      # ================================
      - name: Checkout
        uses: actions/checkout@v4

      # ================================
      # نصب Python
      # ================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================================
      # نصب کتابخانه‌ها
      # ================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow jdatetime

      # ================================
      # اجرای ربات
      # ================================
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
        run: |
          python bot.py

      # ================================
      # ذخیره وضعیت ربات
      # ================================
      - name: Save bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bot_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update football bot state"
            git push
          fi
